version: '3.8'
services:
  db:
    image: postgres:latest
    ports:
      - '5432:5432'
    environment:
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=1234'
      - 'POSTGRES_DB=products-db'
    volumes:
      - 'db:/var/lib/postgresql/data'
volumes:
  db:
    driver: local
  pgadmin_data:
    driver: local
