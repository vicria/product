services:
  db:
    image: postgres:latest
    ports:
      - '5433:5432'
    environment:
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=1234'
      - 'POSTGRES_DB=products-db'
    volumes:
      - 'db:/var/lib/postgresql'
volumes:
  db:
    driver: local
  pgadmin_data:
    driver: local
